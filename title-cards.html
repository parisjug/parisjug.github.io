<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Cartons de titre - Paris JUG</title>
    <style>
        body {
            font-family: 'Lato', 'Cantarell', system-ui, sans-serif;
            margin: 0 auto;
            padding: 24px 16px 64px;
            max-width: 900px;
            color: #1a1a1a;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 0.2em;
        }

        p.intro {
            color: #555;
            margin-top: 0;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
            padding: 16px;
            background: #f4f4f4;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .controls label {
            display: block;
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 4px;
        }

        input[type="date"] {
            font: inherit;
            padding: 6px 8px;
            border: 1px solid #bbb;
            border-radius: 4px;
        }

        button {
            font: inherit;
            padding: 8px 16px;
            border: 0;
            border-radius: 4px;
            background: #a30000;
            color: #fff;
            cursor: pointer;
        }

        button:hover {
            background: #7d0000;
        }

        button:disabled {
            background: #999;
            cursor: default;
        }

        .card {
            margin-bottom: 32px;
        }

        .card h2 {
            font-size: 1.05rem;
            font-weight: normal;
            color: #555;
            margin: 0 0 8px;
        }

        .preview {
            border: 1px solid #ddd;
            line-height: 0;
        }

        .preview svg {
            width: 100%;
            height: auto;
        }

        .card-actions {
            margin-top: 8px;
        }

        #status {
            padding: 12px 16px;
            border-radius: 4px;
            background: #f4f4f4;
        }

        #status.error {
            background: #ffe6e6;
            color: #a30000;
        }
    </style>
</head>
<body>
<h1>Cartons de titre</h1>
<p class="intro">
    Un SVG par talk de <a href="event.json">event.json</a>, au format des anciens exports Google Slides
    (1728 &times; 1080). Le texte est vectoris&eacute; et les logos sont embarqu&eacute;s&nbsp;: le fichier
    s'importe directement dans kdenlive, sans police &agrave; installer.
</p>

<div class="controls">
    <div>
        <label for="event-date">Date de l'&eacute;v&eacute;nement</label>
        <input type="date" id="event-date">
    </div>
    <button id="download-all" disabled>T&eacute;l&eacute;charger tous les SVG</button>
</div>

<div id="status">Chargement&hellip;</div>
<div id="cards"></div>

<script src="vendor/opentype.min.js"></script>
<script src="js/title-card.js"></script>
<script>
    const statusEl = document.getElementById('status');
    const cardsEl = document.getElementById('cards');
    const dateInput = document.getElementById('event-date');
    const downloadAllBtn = document.getElementById('download-all');

    let font = null;
    let images = null;
    let talks = [];

    function fail(message) {
        statusEl.className = 'error';
        statusEl.textContent = message;
    }

    /** Windows-safe file name, otherwise as close to the talk title as possible. */
    function fileNameFor(title) {
        const cleaned = title
            .replace(/[\\/:*?"<>|]/g, '')
            .replace(/\s+/g, ' ')
            .replace(/\s+([)\]}])/g, '$1')
            .trim();
        return `${cleaned || 'carton'}.svg`;
    }

    function downloadSvg(talk) {
        const svg = buildCardSvg(talk, formatFrenchDate(dateInput.value), font, images);
        const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
        const link = document.createElement('a');
        link.href = url;
        link.download = fileNameFor(talk.title);
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function render() {
        cardsEl.textContent = '';
        for (const talk of talks) {
            const svg = buildCardSvg(talk, formatFrenchDate(dateInput.value), font, images);

            const card = document.createElement('div');
            card.className = 'card';

            const heading = document.createElement('h2');
            heading.textContent = `${talk.title} — ${talk.speaker}`;
            card.appendChild(heading);

            const preview = document.createElement('div');
            preview.className = 'preview';
            preview.innerHTML = svg.replace(/^<\?xml[^>]*\?>\s*/, '');
            card.appendChild(preview);

            const actions = document.createElement('div');
            actions.className = 'card-actions';
            const button = document.createElement('button');
            button.textContent = `Télécharger « ${fileNameFor(talk.title)} »`;
            button.addEventListener('click', () => downloadSvg(talk));
            actions.appendChild(button);
            card.appendChild(actions);

            cardsEl.appendChild(card);
        }
        downloadAllBtn.disabled = talks.length === 0;
    }

    downloadAllBtn.addEventListener('click', () => {
        talks.forEach((talk, index) => setTimeout(() => downloadSvg(talk), index * 300));
    });

    dateInput.addEventListener('change', render);

    async function init() {
        try {
            const [eventData, loadedFont, loadedImages] = await Promise.all([
                fetch('event.json').then(r => {
                    if (!r.ok) throw new Error(`event.json: HTTP ${r.status}`);
                    return r.json();
                }),
                opentype.load(CARD_ASSETS.font),
                loadCardImages()
            ]);

            font = loadedFont;
            images = loadedImages;
            talks = talksFromEvent(eventData);
            dateInput.value = (eventData.date || '').trim() || new Date().toISOString().slice(0, 10);

            if (!talks.length) {
                fail('Aucun talk dans event.json.');
                return;
            }
            statusEl.textContent = `${talks.length} talk(s) — ${eventData.event || ''}`;
            render();
        } catch (error) {
            fail(`Erreur : ${error.message}`);
        }
    }

    init();
</script>
</body>
</html>
